name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-projects:
    name: ${{ matrix.name }} Python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Synthevia
            path: projects/synthevia
            module: synthevia_showcase.demo_data
            strict_types: false
          - name: Gargantua
            path: projects/gargantua
            module: gargantua_showcase.demo_data
            strict_types: false
          - name: Strategy Lab
            path: projects/strategy-lab
            module: strategy_lab_showcase.demo
            strict_types: true
          - name: MyTradingBot
            path: projects/mytradingbot
            module: mytradingbot_showcase.qualification
            strict_types: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.11.7"
          cache-dependency-glob: ${{ matrix.path }}/uv.lock
      - run: uv sync --locked --dev --no-install-project
        working-directory: ${{ matrix.path }}
      - run: uv run --no-sync ruff check src tests scripts
        working-directory: ${{ matrix.path }}
      - if: matrix.strict_types
        run: uv run --no-sync mypy src
        working-directory: ${{ matrix.path }}
      - run: uv run --no-sync pytest -q
        working-directory: ${{ matrix.path }}
      - run: PYTHONPATH=src uv run --no-sync python -m ${{ matrix.module }}
        working-directory: ${{ matrix.path }}

  synthevia-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/synthevia/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/synthevia/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  portfolio-site:
    name: Project Atlas site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_markdown_links.py
      - name: Install pinned Gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan complete Git history
        run: gitleaks git --redact
