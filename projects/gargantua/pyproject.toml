[project]
name = "gargantua-showcase"
version = "0.1.0"
description = "Offline, sanitized Discord community workflow components"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
