[project]
name = "mytradingbot-showcase"
version = "0.1.0"
description = "Paper-only automation and risk-control components"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
